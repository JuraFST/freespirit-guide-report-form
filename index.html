<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Spirit Tour Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script>
(function () {
  var t;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="header-row">
      <img class="logo" src="freespirit_logo.png" alt="Free Spirit">
      <span id="today-date" class="today-date"></span>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
      </button>
    </div>
    <h1 id="page-title"><span id="page-title-text">Tour Log</span><img id="title-city-icon" class="title-city-icon" alt=""></h1>

    <div id="sticky-bar" class="sticky-bar">
      <div id="nav-row" class="nav-row hidden">
        <button id="back-button" type="button" class="link-button">&larr; Back</button>
        <span id="progress-label" class="progress-label"></span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="tour-line" class="tour-line hidden"></p>
    </div>

    <section id="step-city" class="step">
      <h2>City</h2>
      <div id="city-buttons" class="button-row"></div>
    </section>

    <section id="step-name" class="step hidden">
      <h2>Name</h2>
      <select id="name-select"></select>
      <button id="name-continue" type="button">Continue</button>
    </section>

    <section id="step-tour" class="step hidden">
      <p class="who-line"><span id="who-line-text"></span><button id="not-you-button" type="button" class="who-link">Not you?</button></p>
      <h2>Tour</h2>
      <select id="tour-select"></select>
      <button id="tour-continue" type="button">Continue</button>
    </section>

    <section id="step-details-free" class="step hidden">
      <h2>Tour details</h2>
      <div class="field">
        <label>Language</label>
        <div id="language-buttons" class="button-row"></div>
      </div>
      <div class="field">
        <label for="pax-input">Pax</label>
        <input id="pax-input" type="number" min="1" step="1" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="field">
        <label for="date-input">Date</label>
        <input id="date-input" type="date">
      </div>
      <div class="field">
        <label for="time-select">Time</label>
        <select id="time-select"></select>
      </div>
      <div class="field">
        <label for="photo-input">Tour photo</label>
        <div class="file-input">
          <label for="photo-input" class="file-button">Choose photo</label>
          <span id="photo-filename" class="file-name">No file chosen</span>
          <input id="photo-input" type="file" accept="image/*" class="visually-hidden">
        </div>
        <div id="photo-thumbs" class="thumbs"></div>
      </div>
      <div class="field">
        <label for="note-input">Note (optional)</label>
        <input id="note-input" type="text">
      </div>
      <p id="details-error" class="error hidden"></p>
      <button id="submit-button" type="button">Submit</button>
    </section>

    <section id="step-details-paid" class="step hidden">
      <h2>Tour details (paid)</h2>
      <div class="field">
        <label>Language</label>
        <div id="paid-language-buttons"></div>
      </div>
      <div class="field">
        <label for="paid-date-input">Date</label>
        <input id="paid-date-input" type="date">
      </div>
      <div class="field">
        <label for="paid-time-select">Time</label>
        <select id="paid-time-select"></select>
      </div>
      <div class="field">
        <label for="paid-pax-input">Total Pax</label>
        <input id="paid-pax-input" type="number" min="1" step="1" inputmode="numeric" pattern="[0-9]*">
        <p class="field-hint">Tap an OTA to enter the pax count.</p>
      </div>
      <div id="channel-buttons" class="button-row button-row--compact"></div>
      <div id="paid-channel-fields"></div>
      <p id="channel-total" class="channel-total"></p>
      <div id="war-extras" class="hidden">
        <div class="field">
          <label>Sold by</label>
          <div id="seller-rows"></div>
          <p id="seller-total" class="channel-total"></p>
          <button id="add-seller-button" type="button" class="link-button">+ Add seller</button>
        </div>
        <div class="field">
          <label>Payment method</label>
          <div id="payment-buttons" class="button-row button-row--compact"></div>
          <div id="payment-fields"></div>
        </div>
      </div>
      <div id="food-extras" class="hidden">
        <div class="field">
          <label>Costs</label>
          <p class="field-hint">Tap a partner to enter the cost.</p>
          <div id="cost-buttons" class="button-row button-row--compact"></div>
          <div id="cost-fields"></div>
          <p id="cost-total" class="channel-total"></p>
        </div>
      </div>
      <div class="field">
        <label for="no-show-input">No Show</label>
        <input id="no-show-input" type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      </div>
      <div class="field">
        <label for="paid-photo-input">Tour photo (optional)</label>
        <div class="file-input">
          <label for="paid-photo-input" class="file-button">Choose photo</label>
          <span id="paid-photo-filename" class="file-name">No file chosen</span>
          <input id="paid-photo-input" type="file" accept="image/*" class="visually-hidden">
        </div>
        <div id="paid-photo-thumbs" class="thumbs"></div>
      </div>
      <div id="invoice-field" class="field hidden">
        <label for="invoice-input">Invoice upload (optional)</label>
        <div class="file-input">
          <label for="invoice-input" class="file-button">Choose invoices</label>
          <span id="invoice-count" class="file-name">No file chosen</span>
          <input id="invoice-input" type="file" accept="image/*" multiple class="visually-hidden">
        </div>
        <div id="invoice-thumbs" class="thumbs"></div>
      </div>
      <div class="field">
        <label for="paid-note-input">Note (optional)</label>
        <input id="paid-note-input" type="text">
      </div>
      <p id="paid-details-error" class="error hidden"></p>
      <button id="paid-submit-button" type="button">Submit</button>
    </section>

    <section id="step-result" class="step hidden">
      <p id="result-message"></p>
      <button id="log-another-button" type="button">Log another tour</button>
    </section>
  </main>
  <footer class="page-footer">
    &copy; 2026 Free Spirit Tours &middot; Built by <a href="https://dodai.io" target="_blank" rel="noopener" class="dodai-link"><img src="dodai-logo-flat.svg" alt="dodai" class="dodai-logo"></a>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
